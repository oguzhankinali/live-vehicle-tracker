services:
  # 1. PostgreSQL + TimescaleDB Servisi
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: vehicle-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-VehicleTrackerDb}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d VehicleTrackerDb"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 2. ASP.NET Core (.NET 8) Web API Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehicle-tracker-backend
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5086
      - ConnectionStrings__DefaultConnection=Host=timescaledb;Port=5432;Database=VehicleTrackerDb;Username=postgres;Password=password123;Include Error Detail=true
    ports:
      - "5086:5086"

  # 3. Next.js 15 Standalone Frontend Servisi
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5086
    container_name: vehicle-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  timescale_data: